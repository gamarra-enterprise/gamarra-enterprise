<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="760 0 420 300" role="img" aria-label="Próximamente: nuevos proyectos">
  <defs>
    <linearGradient id="acc" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/><stop offset=".5" stop-color="#bb9af7" stop-opacity=".9"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bb9af7" stop-opacity=".35"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
    <clipPath id="mainClip"><rect x="30" y="24" width="720" height="252" rx="18"/></clipPath>
    <style>
      .card { fill: #0f121a; stroke: #7aa2f7; stroke-opacity: .38; stroke-width: 1.2; }
      .lab { font: 500 12px 'Consolas','Fira Code','DejaVu Sans Mono',monospace; letter-spacing: 2.5px; fill: #7aa2f7; }
      .title { font: 800 34px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #ffffff; letter-spacing: .5px; }
      .desc { font: 400 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #9aa5ce; }
      .pill { fill: #171b27; stroke: url(#acc); stroke-opacity: .7; stroke-width: 1.2; }
      .pt { font: 600 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #c0caf5; text-anchor: middle; }
      .lg { font: 400 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #9aa5ce; }
      .cta { font: 600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: url(#acc); text-anchor: end; }
      .ok { font: 500 12px 'Consolas','Fira Code',monospace; letter-spacing: 2px; fill: #9ece6a; text-anchor: end; }
      .soon { font: 700 24px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #c0caf5; text-anchor: middle; }
      .soons { font: 400 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #7f849c; text-anchor: middle; }
      .dash { fill: #0f121a; stroke: #bb9af7; stroke-opacity: .45; stroke-width: 1.4; stroke-dasharray: 7 7; animation: march 1.6s linear infinite; }
      .dot { animation: pulse 2.2s ease-in-out infinite; }
      .sweepbar { animation: sweep 5.5s ease-in-out infinite; }
      .seg { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow .9s cubic-bezier(.3,0,.2,1) forwards; }
      .in1 { opacity: 0; animation: up .8s ease-out .1s forwards; }
      .in2 { opacity: 0; animation: up .8s ease-out .35s forwards; }
      .in3 { opacity: 0; animation: up .8s ease-out .6s forwards; }
      .float { animation: float 5s ease-in-out infinite; }
      .orb { transform-origin: 970.0px 124px; animation: spin 14s linear infinite; }
      .plus { transform-origin: 970.0px 124px; animation: spin 9s linear infinite reverse; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes sweep { from { transform: translateX(-340px); } to { transform: translateX(760px); } }
      @keyframes grow { to { transform: scaleX(1); } }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes march { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .seg { transform: none; } .in1,.in2,.in3 { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="300" fill="#0b0d12"/>

  <!-- tarjeta principal -->
  <rect class="card" x="30" y="24" width="720" height="252" rx="18"/>
  <g clip-path="url(#mainClip)">
    <circle cx="690" cy="44" r="150" fill="url(#glow)"/>
    <rect class="sweepbar" x="30" y="24" width="300" height="3" fill="url(#sweep)"/>
  </g>
  <g class="in1">
    <circle class="dot" cx="66" cy="60" r="4" fill="#7aa2f7"/>
    <text class="lab" x="80" y="64">PROYECTO DESTACADO</text>
    <text class="ok" x="718" y="64">● EN DESARROLLO</text>
  </g>
  <g class="in2">
    <text class="title" x="62" y="112">Hardcover Bookery</text>
    <text class="desc" x="62" y="140">Tienda en línea de libros y productos afines.</text>
  </g>
  <g class="in3">
    <rect class="pill" x="62" y="156" width="90" height="30" rx="15"/><text class="pt" x="107" y="176">Laravel</text>
    <rect class="pill" x="162" y="156" width="98" height="30" rx="15"/><text class="pt" x="211" y="176">Livewire</text>
    <rect class="pill" x="270" y="156" width="116" height="30" rx="15"/><text class="pt" x="328" y="176">PostgreSQL</text>
    <rect class="pill" x="396" y="156" width="81" height="30" rx="15"/><text class="pt" x="436" y="176">Docker</text>
    <text class="cta" x="718" y="177">Ver repositorio →</text>
  </g>
  <text class="lab" x="62" y="210" fill="#565f89" style="fill:#565f89">LENGUAJES</text>
    <rect class="seg" style="animation-delay:0.40s" x="62.0" y="224" width="377.3" height="8" rx="4" fill="#7aa2f7"/>
    <rect class="seg" style="animation-delay:0.55s" x="441.3" y="224" width="149.8" height="8" rx="4" fill="#bb9af7"/>
    <rect class="seg" style="animation-delay:0.70s" x="593.1" y="224" width="66.3" height="8" rx="4" fill="#f7768e"/>
    <rect class="seg" style="animation-delay:0.85s" x="661.5" y="224" width="37.0" height="8" rx="4" fill="#7dcfff"/>
    <rect class="seg" style="animation-delay:1.00s" x="700.4" y="224" width="15.0" height="8" rx="4" fill="#e0af68"/>
    <circle cx="66" cy="254" r="4" fill="#7aa2f7"/><text class="lg" x="76" y="258">PHP 57.8%</text>
    <circle cx="168" cy="254" r="4" fill="#bb9af7"/><text class="lg" x="178" y="258">Blade 23.1%</text>
    <circle cx="285" cy="254" r="4" fill="#f7768e"/><text class="lg" x="295" y="258">HTML 10.4%</text>
    <circle cx="395" cy="254" r="4" fill="#7dcfff"/><text class="lg" x="405" y="258">CSS 5.9%</text>
    <circle cx="489" cy="254" r="4" fill="#e0af68"/><text class="lg" x="499" y="258">JavaScript 2.6%</text>

  <!-- tarjeta próximamente -->
  <rect class="dash" x="770" y="24" width="400" height="252" rx="18"/>
  <g class="float">
    <circle cx="970.0" cy="124" r="46" fill="none" stroke="#7aa2f7" stroke-opacity=".25" stroke-dasharray="3 8"/>
    <g class="orb"><circle cx="1016.0" cy="124" r="5" fill="#7aa2f7"/></g>
    <g class="plus"><circle cx="970.0" cy="78" r="3.5" fill="#bb9af7"/></g>
    <circle cx="970.0" cy="124" r="20" fill="url(#acc)" class="dot"/>
    <path d="M962.0 124h16M970.0 116v16" stroke="#0b0d12" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text class="soon" x="970.0" y="214">Próximamente</text>
  <text class="soons" x="970.0" y="242">Nuevos proyectos de distintas áreas</text>
</svg>
