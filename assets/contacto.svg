<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Contacto: construyamos algo juntos. Escríbeme para propuestas de trabajo o colaboraciones">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bb9af7" stop-opacity="0"/><stop offset=".5" stop-color="#bb9af7" stop-opacity=".3"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="10" y="8" width="1180" height="164" rx="18"/></clipPath>
    <style>
      .mono { font: 500 12px "Consolas","Fira Code","DejaVu Sans Mono",monospace; letter-spacing: 3px; }
      .sans { font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      .sw { animation: sw 6s ease-in-out infinite; }
      .ln { stroke-dasharray: 6 8; animation: flow 3s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      @keyframes sw { from { transform: translateX(-400px); } to { transform: translateX(1200px); } }
      .rev { animation: rev 9s ease-in-out infinite; }
      @keyframes rev { 0%,6% { opacity: 0; transform: translateY(8px); } 14%,88% { opacity: 1; transform: translateY(0); } 96%,100% { opacity: 0; } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(2.4); opacity: 0; } }
      .rg { transform-box: fill-box; transform-origin: center; animation: rg 5s ease-out infinite; }
      @keyframes rg { 0% { transform: scale(.3); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
      .nd { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="10" y="8" width="1180" height="164" rx="18" fill="#0f121a" stroke="url(#g)" stroke-opacity=".6" stroke-width="1.4"/>
  <g clip-path="url(#c)"><rect class="sw" x="0" y="8" width="400" height="164" fill="url(#beam)"/></g>
  <circle class="ring" cx="64" cy="48" r="5" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
  <circle class="dot" cx="64" cy="48" r="4" fill="#9ece6a"/>
  <text class="mono" x="80" y="52" fill="#9ece6a">DISPONIBLE PARA COLABORAR</text>
  <g class="rev">
    <text class="sans" x="60" y="106" fill="#ffffff" font-size="42" font-weight="800" letter-spacing=".5">Construyamos algo <tspan fill="url(#g)">juntos.</tspan></text>
    <text class="sans" x="60" y="144" fill="#9aa0b8" font-size="18" letter-spacing=".3">Para propuestas de trabajo, colaboraciones o consultas sobre mis proyectos, escríbeme.</text>
  </g>
  <g fill="none" stroke="#7aa2f7" stroke-opacity=".5" clip-path="url(#c)">
    <circle class="rg" cx="1050" cy="90" r="70" stroke-width="1.4"/>
    <circle class="rg" cx="1050" cy="90" r="70" stroke-width="1.4" style="animation-delay:-1.7s"/>
    <circle class="rg" cx="1050" cy="90" r="70" stroke-width="1.4" style="animation-delay:-3.4s"/>
    <path class="ln" d="M960 130L1010 70L1050 90L1100 50L1140 100" stroke="#bb9af7" stroke-opacity=".6" stroke-width="1.4"/>
  </g>
  <g fill="#bb9af7"><circle class="nd" cx="960" cy="130" r="3.5"/><circle class="nd" cx="1010" cy="70" r="3" style="animation-delay:-.6s"/><circle class="nd" cx="1100" cy="50" r="3.5" style="animation-delay:-1.2s"/><circle class="nd" cx="1140" cy="100" r="3" style="animation-delay:-1.8s"/></g>
  <circle cx="1050" cy="90" r="6" fill="url(#g)"/>
</svg>
