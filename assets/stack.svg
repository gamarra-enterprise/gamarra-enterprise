    <rect class="pill" x="472" y="86" width="92" height="38" rx="19"/><text class="t" x="518" y="110">React</text>
    <rect class="pill" x="578" y="86" width="111" height="38" rx="19"/><text class="t" x="634" y="110">Node.js</text>
    <rect class="pill" x="703" y="86" width="111" height="38" rx="19"/><text class="t" x="758" y="110">Express</text>
    <rect class="pill" x="828" y="86" width="101" height="38" rx="19"/><text class="t" x="878" y="110">Django</text>
  </g>
  <g class="in" style="animation-delay:0.30s">
    <line class="line" x1="30" x2="1170" y1="132" y2="132"/>
