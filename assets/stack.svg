<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Tecnologías">
  <defs>
    <linearGradient id="fadeL" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#0b0d12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0b0d12" stop-opacity="0"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="pillA" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <style>
      .pill { fill: #12151f; stroke: url(#pillA); stroke-opacity: .55; stroke-width: 1.2; }
      .t { font: 600 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #c0caf5; text-anchor: middle; }
      .r1 { animation: left 32s linear infinite; }
      .r2 { animation: right 38s linear infinite; }
      @keyframes left  { from { transform: translateX(0);} to { transform: translateX(-1200px);} }
      @keyframes right { from { transform: translateX(-1200px);} to { transform: translateX(0);} }
      @media (prefers-reduced-motion: reduce) { .r1,.r2 { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="150" fill="#0b0d12"/>

  <g class="r1">
    <g id="row1">
      <rect class="pill" x="20"  y="18" width="150" height="44" rx="22"/><text class="t" x="95"  y="46">JavaScript</text>
      <rect class="pill" x="190" y="18" width="150" height="44" rx="22"/><text class="t" x="265" y="46">TypeScript</text>
      <rect class="pill" x="360" y="18" width="110" height="44" rx="22"/><text class="t" x="415" y="46">React</text>
      <rect class="pill" x="490" y="18" width="130" height="44" rx="22"/><text class="t" x="555" y="46">Node.js</text>
      <rect class="pill" x="640" y="18" width="110" height="44" rx="22"/><text class="t" x="695" y="46">HTML5</text>
      <rect class="pill" x="770" y="18" width="110" height="44" rx="22"/><text class="t" x="825" y="46">CSS3</text>
      <rect class="pill" x="900" y="18" width="130" height="44" rx="22"/><text class="t" x="965" y="46">Python</text>
      <rect class="pill" x="1050" y="18" width="130" height="44" rx="22"/><text class="t" x="1115" y="46">Express</text>
    </g>
    <use href="#row1" x="1200"/>
  </g>

  <g class="r2">
    <g id="row2">
      <rect class="pill" x="20"  y="88" width="110" height="44" rx="22"/><text class="t" x="75"  y="116">Git</text>
      <rect class="pill" x="150" y="88" width="130" height="44" rx="22"/><text class="t" x="215" y="116">GitHub</text>
      <rect class="pill" x="300" y="88" width="120" height="44" rx="22"/><text class="t" x="360" y="116">Linux</text>
      <rect class="pill" x="440" y="88" width="120" height="44" rx="22"/><text class="t" x="500" y="116">Figma</text>
      <rect class="pill" x="580" y="88" width="120" height="44" rx="22"/><text class="t" x="640" y="116">MySQL</text>
      <rect class="pill" x="720" y="88" width="110" height="44" rx="22"/><text class="t" x="775" y="116">PHP</text>
      <rect class="pill" x="850" y="88" width="150" height="44" rx="22"/><text class="t" x="925" y="116">VS Code</text>
      <rect class="pill" x="1020" y="88" width="160" height="44" rx="22"/><text class="t" x="1100" y="116">REST APIs</text>
    </g>
    <use href="#row2" x="1200"/>
  </g>

  <rect x="0" y="0" width="120" height="150" fill="url(#fadeL)"/>
  <rect x="1080" y="0" width="120" height="150" fill="url(#fadeR)"/>
</svg>
