<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" role="img" aria-label="Tecnologías por área">
  <defs>
    <linearGradient id="pillA" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <style>
      .pill { fill: #12151f; stroke: url(#pillA); stroke-opacity: .55; stroke-width: 1.2; }
      .t { font: 600 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #c0caf5; text-anchor: middle; }
      .lab { font: 500 13px 'Consolas','Fira Code','DejaVu Sans Mono',monospace; fill: #7aa2f7; letter-spacing: 2px; }
      .line { stroke: #7aa2f7; stroke-opacity: .12; }
      .in { opacity: 0; animation: up .7s ease-out forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
      @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="382" fill="#0b0d12"/>
