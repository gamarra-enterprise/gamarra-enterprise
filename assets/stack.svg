    <rect class="pill" x="424" y="28" width="140" height="38" rx="19"/><text class="t" x="494" y="52">TypeScript</text>
    <rect class="pill" x="578" y="28" width="101" height="38" rx="19"/><text class="t" x="628" y="52">Python</text>
    <rect class="pill" x="693" y="28" width="72" height="38" rx="19"/><text class="t" x="729" y="52">PHP</text>
