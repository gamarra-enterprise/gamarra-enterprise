    <rect class="pill" x="376" y="260" width="111" height="38" rx="19"/><text class="t" x="432" y="284">UI / UX</text>
    <rect class="pill" x="501" y="260" width="159" height="38" rx="19"/><text class="t" x="580" y="284">Impresión 3D</text>
  </g>
