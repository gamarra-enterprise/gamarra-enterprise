<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Estadísticas de GitHub">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/><stop offset=".5" stop-color="#7aa2f7" stop-opacity=".16"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></linearGradient><style>
 .lab { font: 500 12px 'Consolas','Fira Code','DejaVu Sans Mono',monospace; letter-spacing: 3px; }
 .num { font: 800 40px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #fff; }
 .sub { font: 400 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #7f849c; }
 .t { font: 600 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #c0caf5; }
 .p { font: 600 13px 'Consolas','Fira Code','DejaVu Sans Mono',monospace; fill: #7aa2f7; }
 .dot { animation: pulse 2.4s ease-in-out infinite; }
 .in { opacity: 0; animation: in .8s ease-out forwards; }
 .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
 .cell { opacity: 0; animation: in .5s ease-out forwards; }
 .sw { animation: sw 7s ease-in-out infinite; }
 @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
 @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
 @keyframes grow { to { transform: scaleX(1); } }
 @keyframes sw { from { transform: translateX(-300px); } to { transform: translateX(1200px); } }
 @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in,.cell { opacity: 1; } .bar { transform: none; } }
</style><clipPath id="c"><rect x="10" y="10" width="1180" height="230" rx="16"/></clipPath></defs>
<rect width="1200" height="250" fill="#0b0d12"/>
<rect x="10" y="10" width="285" height="110" rx="16" fill="#0f121a" stroke="#7aa2f7" stroke-opacity=".38" stroke-width="1.2"/><circle class="dot" cx="36" cy="38" r="4" fill="#7aa2f7" style="animation-delay:0.0s"/><text class="lab" x="50" y="42" fill="#7aa2f7">COMMITS</text><g class="in" style="animation-delay:0.2s"><text class="num" x="34" y="88">62</text><text class="sub" x="96" y="88">últimos 12 meses</text></g><rect x="305" y="10" width="285" height="110" rx="16" fill="#0f121a" stroke="#bb9af7" stroke-opacity=".38" stroke-width="1.2"/><circle class="dot" cx="331" cy="38" r="4" fill="#bb9af7" style="animation-delay:0.3s"/><text class="lab" x="345" y="42" fill="#bb9af7">RACHA</text><g class="in" style="animation-delay:0.35s"><text class="num" x="329" y="88">0</text><text class="sub" x="367" y="88">días seguidos · mejor 2</text></g><rect x="10" y="130" width="285" height="110" rx="16" fill="#0f121a" stroke="#bb9af7" stroke-opacity=".38" stroke-width="1.2"/><circle class="dot" cx="36" cy="158" r="4" fill="#bb9af7" style="animation-delay:0.6s"/><text class="lab" x="50" y="162" fill="#bb9af7">REPOSITORIOS</text><g class="in" style="animation-delay:0.5s"><text class="num" x="34" y="208">1</text><text class="sub" x="72" y="208">públicos · 0 ★</text></g><rect x="305" y="130" width="285" height="110" rx="16" fill="#0f121a" stroke="#7aa2f7" stroke-opacity=".38" stroke-width="1.2"/><circle class="dot" cx="331" cy="158" r="4" fill="#7aa2f7" style="animation-delay:0.8999999999999999s"/><text class="lab" x="345" y="162" fill="#7aa2f7">SEGUIDORES</text><g class="in" style="animation-delay:0.6499999999999999s"><text class="num" x="329" y="208">0</text><text class="sub" x="367" y="208">en GitHub</text></g><rect x="610" y="10" width="580" height="230" rx="16" fill="#0f121a" stroke="#7aa2f7" stroke-opacity=".38" stroke-width="1.2"/><circle class="dot" cx="636" cy="38" r="4" fill="#7aa2f7"/><text class="lab" x="650" y="42" fill="#7aa2f7">LENGUAJES</text><g class="in"><text class="t" x="900" y="118" text-anchor="middle">Proyectos principales en repositorios privados</text><text class="sub" x="900" y="146" text-anchor="middle">Los lenguajes se mostrarán aquí cuando haya código público.</text></g>
<g clip-path="url(#c)"><rect class="sw" x="0" y="0" width="300" height="250" fill="url(#beam)"/></g>
</svg>
