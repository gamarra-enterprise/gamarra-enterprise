<svg xmlns="http://www.w3.org/2000/svg" width="470" height="24" viewBox="0 0 470 24" role="img" aria-label="Ubicación: Lima, Perú. Ahora: construyendo, aprendiendo, diseñando">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c1"><rect x="0" y="0" width="210" height="24" rx="3"/></clipPath>
    <clipPath id="c2"><rect x="222" y="0" width="248" height="24" rx="3"/></clipPath>
    <style>
      text { font: 700 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing: 1px; }
      .lab { fill: #e4ecff; }
      .val { font-weight: 600; letter-spacing: .5px; fill: #7aa2f7; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
      .sw { animation: sw 5s ease-in-out infinite; }
      @keyframes sw { from { transform: translateX(-90px); } to { transform: translateX(300px); } }
      .w { opacity: 0; animation: w 9s ease-in-out infinite; }
      .w2 { animation-delay: 3s; } .w3 { animation-delay: 6s; }
      @keyframes w { 0%,4% { opacity: 0; transform: translateY(6px); } 10%,30% { opacity: 1; transform: translateY(0); } 36%,100% { opacity: 0; transform: translateY(-6px); } }
      .dot { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .w1 { opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#c1)">
    <rect width="210" height="24" fill="#12151f"/><rect width="92" height="24" fill="#1b2030"/>
    <text class="lab" x="12" y="16">UBICACIÓN</text>
    <circle class="ring" cx="108" cy="12" r="4" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <circle cx="108" cy="12" r="3" fill="url(#g)"/>
    <text class="val" x="120" y="16">Lima, Perú</text>
    <rect class="sw" x="0" y="0" width="90" height="24" fill="url(#beam)"/>
  </g>
  <g clip-path="url(#c2)">
    <rect x="222" width="248" height="24" fill="#12151f"/><rect x="222" width="62" height="24" fill="#1b2030"/>
    <text class="lab" x="234" y="16">AHORA</text>
    <circle class="dot" cx="299" cy="12" r="3" fill="#9ece6a"/>
    <text class="val w w1" x="311" y="16">Construyendo Hardcover</text>
    <text class="val w w2" x="311" y="16">Aprendiendo cada día</text>
    <text class="val w w3" x="311" y="16">Diseñando interfaces</text>
    <rect class="sw" x="222" y="0" width="90" height="24" fill="url(#beam)" style="animation-delay:-2.5s"/>
  </g>
</svg>
