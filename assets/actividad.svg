<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Actividad: contribuciones y lenguajes más usados">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/><stop offset=".5" stop-color="#7aa2f7" stop-opacity=".35"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="10" y="6" width="1180" height="52" rx="14"/></clipPath>
    <style>
      .mono { font: 500 12px "Consolas","Fira Code","DejaVu Sans Mono",monospace; letter-spacing: 3px; }
      .sans { font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      .sw { animation: sw 6s ease-in-out infinite; }
      .ln { stroke-dasharray: 6 8; animation: flow 3s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      @keyframes sw { from { transform: translateX(-300px); } to { transform: translateX(1200px); } }
    </style>
  </defs>
  <rect x="10" y="6" width="1180" height="52" rx="14" fill="#0f121a" stroke="#7aa2f7" stroke-opacity=".38" stroke-width="1.2"/>
  <g clip-path="url(#c)"><rect class="sw" x="0" y="6" width="300" height="52" fill="url(#beam)"/></g>
  <circle class="dot" cx="38" cy="32" r="4" fill="#7aa2f7"/>
  <text class="mono" x="54" y="36" fill="#7aa2f7">ACTIVIDAD</text>
  <text class="mono" x="1162" y="36" fill="#bb9af7" text-anchor="end">ÚLTIMOS 12 MESES</text>
  <line class="ln" x1="250" y1="32" x2="940" y2="32" stroke="#7aa2f7" stroke-opacity=".45" stroke-width="1.5"/>
  <circle class="dot" cx="1176" cy="32" r="0" fill="#bb9af7"/>
</svg>
